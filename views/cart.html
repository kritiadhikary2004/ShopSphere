<!DOCTYPE html>

<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Shopping Cart | ShopSphere</title>

<style>

    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: Arial, Helvetica, sans-serif;
    }

    body {
        background: #f7f8ff;
        color: #222;
    }

    /* NAVBAR */

    nav {
        height: 72px;
        background: white;

        display: flex;
        align-items: center;
        justify-content: space-between;

        padding: 0 7%;

        box-shadow: 0 2px 15px rgba(0,0,0,0.06);
    }

    .logo {
        font-size: 24px;
        font-weight: bold;
        color: #5b5cf0;
    }

    .nav-links {
        display: flex;
        gap: 25px;
        align-items: center;
    }

    .nav-links a {
        text-decoration: none;
        color: #555;
        font-size: 14px;
    }

    .nav-links a:hover {
        color: #5b5cf0;
    }

    .cart-btn {
        background: #5b5cf0;
        color: white !important;
        padding: 10px 17px;
        border-radius: 8px;
    }

    /* CONTAINER */

    .container {
        width: 86%;
        max-width: 1100px;
        margin: 50px auto;
    }

    h1 {
        font-size: 35px;
        margin-bottom: 10px;
    }

    .subtitle {
        color: #777;
        margin-bottom: 30px;
    }

    /* CART */

    .cart-box {
        background: white;
        border-radius: 16px;
        padding: 30px;
        box-shadow: 0 7px 25px rgba(0,0,0,0.06);
    }

    /* EMPTY CART */

    .empty-cart {
        text-align: center;
        padding: 60px 20px;
    }

    .empty-cart .icon {
        font-size: 70px;
        margin-bottom: 20px;
    }

    .empty-cart h2 {
        margin-bottom: 10px;
    }

    .empty-cart p {
        color: #888;
        margin-bottom: 25px;
    }

    .shop-btn {
        display: inline-block;
        text-decoration: none;
        background: #5b5cf0;
        color: white;
        padding: 12px 25px;
        border-radius: 8px;
        font-weight: bold;
    }

    .shop-btn:hover {
        background: #4849d8;
    }

    /* CART ITEM */

    .cart-item {
        display: flex;
        align-items: center;
        justify-content: space-between;

        padding: 20px 0;

        border-bottom: 1px solid #eee;
        gap: 20px;
    }

    .cart-item:last-child {
        border-bottom: none;
    }

    .item-info {
        flex: 1;
    }

    .item-info h3 {
        font-size: 18px;
        margin-bottom: 7px;
    }

    .item-price {
        color: #5b5cf0;
        font-weight: bold;
    }

    /* QUANTITY */

    .quantity {
        display: flex;
        align-items: center;
        gap: 10px;
    }

    .quantity button {
        width: 32px;
        height: 32px;

        border: none;
        border-radius: 6px;

        background: #eeeeff;
        color: #5b5cf0;

        font-size: 18px;
        font-weight: bold;

        cursor: pointer;
    }

    .quantity button:hover {
        background: #5b5cf0;
        color: white;
    }

    .quantity span {
        min-width: 25px;
        text-align: center;
        font-weight: bold;
    }

    /* REMOVE */

    .remove-btn {
        border: none;
        background: #ffeaea;

        color: #e74c3c;

        padding: 8px 12px;

        border-radius: 7px;

        cursor: pointer;
        font-weight: bold;
    }

    .remove-btn:hover {
        background: #e74c3c;
        color: white;
    }

    /* SUMMARY */

    .cart-summary {
        margin-top: 25px;

        padding-top: 25px;

        border-top: 2px solid #eee;

        display: flex;
        justify-content: space-between;
        align-items: center;
    }

    .total-title {
        font-size: 18px;
        color: #555;
    }

    .total-price {
        font-size: 25px;
        font-weight: bold;
        color: #5b5cf0;
    }

    .checkout-btn {
        margin-top: 20px;

        width: 100%;

        padding: 14px;

        border: none;

        border-radius: 9px;

        background: linear-gradient(
            135deg,
            #5b5cf0,
            #785ff5
        );

        color: white;

        font-size: 15px;
        font-weight: bold;

        cursor: pointer;
    }

    .checkout-btn:hover {
        opacity: 0.9;
    }

    /* FOOTER */

    footer {
        margin-top: 100px;
        background: #202033;
        color: white;
        text-align: center;
        padding: 35px;
    }

    footer p {
        color: #aaa;
        margin-top: 8px;
        font-size: 13px;
    }

    /* MOBILE */

    @media(max-width: 600px) {

        .nav-links a:not(.cart-btn) {
            display: none;
        }

        .container {
            width: 90%;
        }

        h1 {
            font-size: 28px;
        }

        .cart-item {
            flex-direction: column;
            align-items: flex-start;
        }

        .cart-summary {
            flex-direction: column;
            align-items: flex-start;
            gap: 10px;
        }

    }

</style>
```

</head>

<body>

```
<!-- NAVBAR -->

<nav>

    <div class="logo">
        🛒 ShopSphere
    </div>

    <div class="nav-links">

        <a href="/">
            Home
        </a>

        <a href="/products">
            Products
        </a>

        <a href="/customer-dashboard">
            Dashboard
        </a>

        <a href="/cart" class="cart-btn">
            🛒 Cart
        </a>

    </div>

</nav>


<!-- MAIN -->

<div class="container">

    <h1>
        Shopping Cart 🛒
    </h1>

    <p class="subtitle">
        Review the products you want to purchase.
    </p>


    <div class="cart-box">

        <!-- CART ITEMS WILL APPEAR HERE -->

        <div id="cartItems"></div>

        <!-- TOTAL -->

        <div id="cartSummary" style="display:none;">

            <div class="cart-summary">

                <div class="total-title">
                    Total Amount
                </div>

                <div class="total-price" id="totalPrice">
                    Rs. 0
                </div>

            </div>

            <button
                class="checkout-btn"
                onclick="checkout()">

                Proceed to Checkout 🛍️

            </button>

        </div>

    </div>

</div>


<!-- FOOTER -->

<footer>

    <h3>
        🛒 ShopSphere
    </h3>

    <p>
        Your marketplace for everything you need.
    </p>

    <p>
        © 2026 ShopSphere. All rights reserved.
    </p>

</footer>


<!-- JAVASCRIPT -->

<script>

    // =========================
    // LOAD CART
    // =========================

    function loadCart() {

        let cart =
            JSON.parse(localStorage.getItem("cart")) || [];

        const cartItems =
            document.getElementById("cartItems");

        const cartSummary =
            document.getElementById("cartSummary");


        // EMPTY CART

        if (cart.length === 0) {

            cartItems.innerHTML = `

                <div class="empty-cart">

                    <div class="icon">
                        🛒
                    </div>

                    <h2>
                        Your Cart is Empty
                    </h2>

                    <p>
                        You haven't added any products to your cart yet.
                    </p>

                    <a
                        href="/products"
                        class="shop-btn">

                        🛍️ Browse Products

                    </a>

                </div>

            `;

            cartSummary.style.display = "none";

            return;
        }


        // DISPLAY PRODUCTS

        cartItems.innerHTML = "";

        let total = 0;


        cart.forEach((product, index) => {

            const itemTotal =
                product.price * product.quantity;

            total += itemTotal;


            cartItems.innerHTML += `

                <div class="cart-item">

                    <div class="item-info">

                        <h3>
                            ${product.name}
                        </h3>

                        <div class="item-price">
                            Rs. ${product.price.toLocaleString()}
                        </div>

                    </div>


                    <div class="quantity">

                        <button
                            onclick="decreaseQuantity(${index})">
                            −
                        </button>

                        <span>
                            ${product.quantity}
                        </span>

                        <button
                            onclick="increaseQuantity(${index})">
                            +
                        </button>

                    </div>


                    <div class="item-price">

                        Rs. ${itemTotal.toLocaleString()}

                    </div>


                    <button
                        class="remove-btn"
                        onclick="removeItem(${index})">

                        Remove

                    </button>

                </div>

            `;

        });


        // SHOW SUMMARY

        cartSummary.style.display = "block";

        document.getElementById("totalPrice").textContent =
            "Rs. " + total.toLocaleString();

    }


    // =========================
    // INCREASE QUANTITY
    // =========================

    function increaseQuantity(index) {

        let cart =
            JSON.parse(localStorage.getItem("cart")) || [];

        cart[index].quantity++;

        localStorage.setItem(
            "cart",
            JSON.stringify(cart)
        );

        loadCart();
    }


    // =========================
    // DECREASE QUANTITY
    // =========================

    function decreaseQuantity(index) {

        let cart =
            JSON.parse(localStorage.getItem("cart")) || [];


        if (cart[index].quantity > 1) {

            cart[index].quantity--;

        } else {

            cart.splice(index, 1);

        }


        localStorage.setItem(
            "cart",
            JSON.stringify(cart)
        );

        loadCart();
    }


    // =========================
    // REMOVE ITEM
    // =========================

    function removeItem(index) {

        let cart =
            JSON.parse(localStorage.getItem("cart")) || [];

        cart.splice(index, 1);

        localStorage.setItem(
            "cart",
            JSON.stringify(cart)
        );

        loadCart();
    }


    // =========================
    // CHECKOUT
    // =========================

    function checkout() {

    let cart =
        JSON.parse(localStorage.getItem("cart")) || [];

    if (cart.length === 0) {

        alert("Your cart is empty! 🛒");
        return;

    }

    window.location.href = "/checkout";

}


    // =========================
    // LOAD CART WHEN PAGE OPENS
    // =========================

    loadCart();

</script>


</body>

</html>
