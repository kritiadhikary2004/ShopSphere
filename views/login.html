<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | ShopSphere</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #f5f7ff, #eef2ff);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 30px;
        }

        .container {
            width: 100%;
            max-width: 950px;
            min-height: 560px;
            background: white;
            border-radius: 25px;
            overflow: hidden;
            display: flex;
            box-shadow: 0 15px 45px rgba(0, 0, 0, 0.12);
        }


        /* LEFT SECTION */

        .left-section {
            width: 50%;
            background: linear-gradient(145deg, #5b5cf0, #7b61ff);
            color: white;
            padding: 55px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .logo {
            font-size: 28px;
            font-weight: bold;
            margin-bottom: 65px;
        }

        .left-section h1 {
            font-size: 42px;
            line-height: 1.2;
            margin-bottom: 20px;
        }

        .left-section p {
            font-size: 16px;
            line-height: 1.7;
            opacity: 0.9;
            max-width: 380px;
        }

        .features {
            margin-top: 35px;
        }

        .feature {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 15px;
            font-size: 15px;
        }

        .check {
            width: 25px;
            height: 25px;
            background: rgba(255,255,255,0.2);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
        }


        /* RIGHT SECTION */

        .right-section {
            width: 50%;
            padding: 55px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .right-section h2 {
            font-size: 30px;
            color: #222;
            margin-bottom: 8px;
        }

        .subtitle {
            color: #777;
            margin-bottom: 30px;
            font-size: 14px;
        }


        /* FORM */

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            font-weight: 600;
            color: #333;
        }

        .form-group input {
            width: 100%;
            padding: 14px 15px;
            border: 1px solid #ddd;
            border-radius: 10px;
            font-size: 14px;
            outline: none;
            background: #fafafa;
            transition: 0.3s;
        }

        .form-group input:focus {
            border-color: #625cf5;
            background: white;
            box-shadow: 0 0 0 3px rgba(98,92,245,0.1);
        }


        /* FORGOT PASSWORD */

        .forgot {
            text-align: right;
            margin-top: -8px;
            margin-bottom: 20px;
        }

        .forgot a {
            color: #5b5cf0;
            text-decoration: none;
            font-size: 13px;
        }


        /* LOGIN BUTTON */

        .login-btn {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 10px;
            background: linear-gradient(135deg, #5b5cf0, #7b61ff);
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        .login-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(91,92,240,0.3);
        }


        /* REGISTER TEXT */

        .register-text {
            text-align: center;
            margin-top: 25px;
            color: #777;
            font-size: 14px;
        }

        .register-text a {
            color: #5b5cf0;
            text-decoration: none;
            font-weight: bold;
        }

        .register-text a:hover {
            text-decoration: underline;
        }


        /* MOBILE */

        @media (max-width: 750px) {

            .container {
                flex-direction: column;
            }

            .left-section,
            .right-section {
                width: 100%;
            }

            .left-section {
                padding: 40px;
            }

            .logo {
                margin-bottom: 35px;
            }

            .left-section h1 {
                font-size: 32px;
            }

            .right-section {
                padding: 40px;
            }
        }

    </style>

</head>


<body>

    <div class="container">


        <!-- LEFT SIDE -->

        <div class="left-section">

            <div class="logo">
                🛒 ShopSphere
            </div>

            <h1>
                Welcome<br>
                Back!
            </h1>

            <p>
                Login to your ShopSphere account and
                continue shopping or managing your store.
            </p>


            <div class="features">

                <div class="feature">
                    <span class="check">✓</span>
                    <span>Access your account</span>
                </div>

                <div class="feature">
                    <span class="check">✓</span>
                    <span>Manage your orders</span>
                </div>

                <div class="feature">
                    <span class="check">✓</span>
                    <span>Shop with confidence</span>
                </div>

            </div>

        </div>


        <!-- RIGHT SIDE -->

        <div class="right-section">

            <h2>Login</h2>

            <p class="subtitle">
                Welcome back! Please login to your account.
            </p>


            <form action="/login" method="POST">


                <!-- EMAIL -->

                <div class="form-group">

                    <label for="email">
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter your email"
                        required
                    >

                </div>


                <!-- PASSWORD -->

                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Enter your password"
                        required
                    >

                </div>


                <!-- FORGOT PASSWORD -->

                <div class="forgot">

                    <a href="#">
                        Forgot Password?
                    </a>

                </div>


                <!-- LOGIN BUTTON -->

                <button
                    type="submit"
                    class="login-btn">
                    Login
                </button>

            </form>


            <!-- REGISTER -->

            <p class="register-text">

                Don't have an account?

                <a href="/register">
                    Create Account
                </a>

            </p>

        </div>

    </div>

</body>

</html>
