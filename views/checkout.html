<!DOCTYPE html>

<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Checkout | ShopSphere</title>

<style>

    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: Arial, Helvetica, sans-serif;
    }

    body {
        background: #f7f8ff;
        color: #222;
    }

    nav {
        height: 72px;
        background: white;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 7%;
        box-shadow: 0 2px 15px rgba(0,0,0,0.06);
    }

    .logo {
        font-size: 24px;
        font-weight: bold;
        color: #5b5cf0;
    }

    .nav-links {
        display: flex;
        gap: 25px;
        align-items: center;
    }

    .nav-links a {
        text-decoration: none;
        color: #555;
        font-size: 14px;
    }

    .nav-links a:hover {
        color: #5b5cf0;
    }

    .cart-btn {
        background: #5b5cf0;
        color: white !important;
        padding: 10px 17px;
        border-radius: 8px;
    }

    .container {
        width: 86%;
        max-width: 1100px;
        margin: 50px auto;
    }

    h1 {
        font-size: 35px;
        margin-bottom: 10px;
    }

    .subtitle {
        color: #777;
        margin-bottom: 30px;
    }

    .checkout-grid {
        display: grid;
        grid-template-columns: 1.5fr 1fr;
        gap: 25px;
    }

    .box {
        background: white;
        padding: 30px;
        border-radius: 16px;
        box-shadow: 0 7px 25px rgba(0,0,0,0.06);
    }

    .box h2 {
        margin-bottom: 25px;
        font-size: 22px;
    }

    .form-group {
        margin-bottom: 18px;
    }

    .form-group label {
        display: block;
        margin-bottom: 7px;
        font-size: 14px;
        font-weight: bold;
    }

    .form-group input,
    .form-group textarea {
        width: 100%;
        padding: 13px;
        border: 1px solid #ddd;
        border-radius: 8px;
        outline: none;
        font-size: 14px;
    }

    .form-group input:focus,
    .form-group textarea:focus {
        border-color: #5b5cf0;
    }

    .form-group textarea {
        height: 90px;
        resize: none;
    }

    .order-item {
        display: flex;
        justify-content: space-between;
        padding: 12px 0;
        border-bottom: 1px solid #eee;
        font-size: 14px;
    }

    .total {
        display: flex;
        justify-content: space-between;
        margin-top: 20px;
        font-size: 20px;
        font-weight: bold;
        color: #5b5cf0;
    }

    .place-order {
        width: 100%;
        margin-top: 25px;
        padding: 14px;
        border: none;
        border-radius: 9px;
        background: linear-gradient(135deg, #5b5cf0, #785ff5);
        color: white;
        font-weight: bold;
        font-size: 15px;
        cursor: pointer;
    }

    .place-order:hover {
        opacity: 0.9;
    }

    footer {
        margin-top: 100px;
        background: #202033;
        color: white;
        text-align: center;
        padding: 35px;
    }

    footer p {
        color: #aaa;
        margin-top: 8px;
        font-size: 13px;
    }

    @media(max-width: 750px) {

        .checkout-grid {
            grid-template-columns: 1fr;
        }

        .container {
            width: 90%;
        }

        .nav-links a:not(.cart-btn) {
            display: none;
        }

        h1 {
            font-size: 28px;
        }
    }

</style>
```

</head>

<body>

```
<nav>

    <div class="logo">
        🛒 ShopSphere
    </div>

    <div class="nav-links">

        <a href="/">
            Home
        </a>

        <a href="/products">
            Products
        </a>

        <a href="/cart" class="cart-btn">
            🛒 Cart
        </a>

    </div>

</nav>


<div class="container">

    <h1>
        Checkout 💳
    </h1>

    <p class="subtitle">
        Enter your delivery details and place your order.
    </p>


    <div class="checkout-grid">


        <!-- CUSTOMER DETAILS -->

        <div class="box">

            <h2>
                Delivery Information 📦
            </h2>

            <form id="checkoutForm">

                <div class="form-group">

                    <label>
                        Full Name
                    </label>

                    <input
                        type="text"
                        id="name"
                        placeholder="Enter your full name"
                        required>

                </div>


                <div class="form-group">

                    <label>
                        Phone Number
                    </label>

                    <input
                        type="tel"
                        id="phone"
                        placeholder="Enter your phone number"
                        required>

                </div>


                <div class="form-group">

                    <label>
                        Delivery Address
                    </label>

                    <textarea
                        id="address"
                        placeholder="Enter your delivery address"
                        required></textarea>

                </div>


                <div class="form-group">

                    <label>
                        Payment Method
                    </label>

                    <input
                        type="text"
                        value="Cash on Delivery"
                        readonly>

                </div>


                <button
                    type="submit"
                    class="place-order">

                    🛍️ Place Order

                </button>

            </form>

        </div>


        <!-- ORDER SUMMARY -->

        <div class="box">

            <h2>
                Order Summary 🛒
            </h2>

            <div id="orderItems"></div>

            <div class="total">

                <span>
                    Total
                </span>

                <span id="totalPrice">
                    Rs. 0
                </span>

            </div>

        </div>

    </div>

</div>


<footer>

    <h3>
        🛒 ShopSphere
    </h3>

    <p>
        Your marketplace for everything you need.
    </p>

    <p>
        © 2026 ShopSphere. All rights reserved.
    </p>

</footer>


<script>

    // Get cart from localStorage

    const cart =
        JSON.parse(localStorage.getItem("cart")) || [];


    const orderItems =
        document.getElementById("orderItems");

    const totalPrice =
        document.getElementById("totalPrice");


    let total = 0;


    if (cart.length === 0) {

        orderItems.innerHTML =
            "<p>Your cart is empty.</p>";

    } else {

        cart.forEach(product => {

            const itemTotal =
                product.price * product.quantity;

            total += itemTotal;


            const item =
                document.createElement("div");

            item.className = "order-item";

            item.innerHTML = `
                <span>
                    ${product.name} × ${product.quantity}
                </span>

                <span>
                    Rs. ${itemTotal.toLocaleString()}
                </span>
            `;

            orderItems.appendChild(item);

        });

    }


    totalPrice.textContent =
        "Rs. " + total.toLocaleString();


    // Place order

    document
        .getElementById("checkoutForm")
        .addEventListener("submit", function(event) {

            event.preventDefault();


            if (cart.length === 0) {

                alert("Your cart is empty!");

                return;

            }


            const name =
                document.getElementById("name").value;

            alert(
                "🎉 Order placed successfully!\n\n" +
                "Thank you, " + name + "!"
            );


            // Clear cart

            localStorage.removeItem("cart");


            // Go to products

            window.location.href = "/products";

        });

</script>

</body>

</html>
