<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Orders | ShopSphere</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            background: #f7f8fc;
            color: #1e293b;
        }

        /* =========================
           NAVBAR
        ========================= */

        nav {
            height: 72px;
            background: white;

            display: flex;
            align-items: center;
            justify-content: space-between;

            padding: 0 7%;

            border-bottom: 1px solid #e5e7eb;

            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo {
            font-size: 24px;
            font-weight: 800;
            color: #4f46e5;
        }

        .nav-links {
            display: flex;
            align-items: center;
            gap: 25px;
        }

        .nav-links a {
            text-decoration: none;
            color: #64748b;
            font-size: 14px;
            font-weight: 600;

            transition: 0.2s;
        }

        .nav-links a:hover {
            color: #4f46e5;
        }

        .cart-btn {
            background: #4f46e5;
            color: white !important;

            padding: 10px 17px;
            border-radius: 8px;
        }


        /* =========================
           MAIN CONTAINER
        ========================= */

        .container {
            width: 86%;
            max-width: 1100px;

            margin: 45px auto 70px;
        }

        .page-header {
            margin-bottom: 30px;
        }

        .page-header h1 {
            font-size: 32px;
            color: #0f172a;
            margin-bottom: 8px;
        }

        .page-header p {
            color: #64748b;
            font-size: 14px;
        }


        /* =========================
           ORDER SUMMARY CARDS
        ========================= */

        .order-stats {
            display: grid;

            grid-template-columns: repeat(3, 1fr);

            gap: 18px;

            margin-bottom: 30px;
        }

        .stat {
            background: white;

            border: 1px solid #e2e8f0;

            border-radius: 14px;

            padding: 20px;

            display: flex;
            align-items: center;

            gap: 15px;
        }

        .stat-icon {
            width: 48px;
            height: 48px;

            border-radius: 12px;

            background: #eef2ff;

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 22px;
        }

        .stat h3 {
            font-size: 20px;
            margin-bottom: 4px;
        }

        .stat p {
            color: #64748b;
            font-size: 12px;
        }


        /* =========================
           ORDERS BOX
        ========================= */

        .orders-box {
            background: white;

            border: 1px solid #e2e8f0;

            border-radius: 16px;

            overflow: hidden;
        }

        .orders-header {
            padding: 22px 25px;

            border-bottom: 1px solid #e2e8f0;

            display: flex;

            justify-content: space-between;
            align-items: center;
        }

        .orders-header h2 {
            font-size: 20px;
            color: #1e293b;
        }

        .orders-header span {
            font-size: 13px;
            color: #64748b;
        }


        /* =========================
           ORDER CARD
        ========================= */

        .order-card {
            padding: 24px 25px;

            border-bottom: 1px solid #edf0f4;

            transition: 0.2s;
        }

        .order-card:last-child {
            border-bottom: none;
        }

        .order-card:hover {
            background: #fafaff;
        }

        .order-top {
            display: flex;

            justify-content: space-between;
            align-items: center;

            margin-bottom: 20px;
        }

        .order-id {
            font-size: 14px;
            font-weight: bold;

            color: #1e293b;
        }

        .order-date {
            font-size: 12px;
            color: #94a3b8;

            margin-top: 5px;
        }


        /* =========================
           STATUS
        ========================= */

        .status {
            padding: 7px 13px;

            border-radius: 20px;

            font-size: 11px;

            font-weight: bold;
        }

        .status.pending {
            background: #fff7ed;
            color: #ea580c;
        }

        .status.processing {
            background: #eef2ff;
            color: #4f46e5;
        }

        .status.delivered {
            background: #ecfdf5;
            color: #059669;
        }

        .status.cancelled {
            background: #fef2f2;
            color: #dc2626;
        }


        /* =========================
           PRODUCT
        ========================= */

        .product-row {
            display: flex;

            align-items: center;

            justify-content: space-between;

            gap: 20px;
        }

        .product-info {
            display: flex;

            align-items: center;

            gap: 15px;

            flex: 1;
        }

        .product-image {
            width: 58px;
            height: 58px;

            border-radius: 12px;

            background: #eef2ff;

            display: flex;

            align-items: center;
            justify-content: center;

            font-size: 27px;
        }

        .product-info h3 {
            font-size: 15px;

            margin-bottom: 6px;
        }

        .product-info p {
            font-size: 12px;
            color: #64748b;
        }

        .product-price {
            text-align: right;
        }

        .product-price strong {
            display: block;

            color: #4f46e5;

            font-size: 15px;

            margin-bottom: 5px;
        }

        .product-price span {
            font-size: 12px;
            color: #94a3b8;
        }


        /* =========================
           ORDER BOTTOM
        ========================= */

        .order-bottom {
            margin-top: 20px;

            padding-top: 17px;

            border-top: 1px solid #f0f1f4;

            display: flex;

            justify-content: space-between;

            align-items: center;
        }

        .total-label {
            color: #64748b;
            font-size: 13px;
        }

        .total {
            font-size: 18px;
            font-weight: bold;

            color: #0f172a;
        }

        .view-btn {
            text-decoration: none;

            padding: 9px 15px;

            border: 1px solid #c7d2fe;

            border-radius: 8px;

            color: #4f46e5;

            font-size: 12px;

            font-weight: bold;

            transition: 0.2s;
        }

        .view-btn:hover {
            background: #4f46e5;
            color: white;
        }


        /* =========================
           EMPTY ORDERS
        ========================= */

        .empty-orders {
            text-align: center;

            padding: 70px 20px;
        }

        .empty-icon {
            font-size: 65px;

            margin-bottom: 18px;
        }

        .empty-orders h2 {
            font-size: 21px;

            margin-bottom: 9px;
        }

        .empty-orders p {
            color: #64748b;

            font-size: 14px;

            margin-bottom: 25px;
        }

        .shop-btn {
            display: inline-block;

            text-decoration: none;

            background: #4f46e5;

            color: white;

            padding: 12px 22px;

            border-radius: 8px;

            font-size: 13px;

            font-weight: bold;

            transition: 0.2s;
        }

        .shop-btn:hover {
            background: #4338ca;
        }


        /* =========================
           FOOTER
        ========================= */

        footer {
            background: #111827;

            color: white;

            text-align: center;

            padding: 35px;
        }

        footer h3 {
            margin-bottom: 8px;
        }

        footer p {
            color: #94a3b8;

            font-size: 13px;

            margin-top: 6px;
        }


        /* =========================
           RESPONSIVE
        ========================= */

        @media(max-width: 800px) {

            .order-stats {
                grid-template-columns: 1fr;
            }

            .product-row {
                align-items: flex-start;
            }

        }


        @media(max-width: 600px) {

            nav {
                padding: 0 5%;
            }

            .nav-links {
                gap: 10px;
            }

            .nav-links a:not(.cart-btn) {
                display: none;
            }

            .container {
                width: 90%;
                margin-top: 30px;
            }

            .page-header h1 {
                font-size: 27px;
            }

            .orders-header {
                padding: 18px;
            }

            .order-card {
                padding: 20px 18px;
            }

            .order-top {
                align-items: flex-start;

                gap: 10px;
            }

            .product-row {
                flex-direction: column;

                align-items: flex-start;
            }

            .product-price {
                text-align: left;

                margin-left: 73px;
            }

            .order-bottom {
                align-items: flex-start;

                gap: 15px;

                flex-direction: column;
            }

        }

    </style>

</head>


<body>


<!-- =========================
     NAVBAR
========================= -->

<nav>

    <div class="logo">
        🛒 ShopSphere
    </div>

    <div class="nav-links">

        <a href="/">
            Home
        </a>

        <a href="/products">
            Products
        </a>

        <a href="/customer-dashboard">
            Dashboard
        </a>

        <a href="/cart" class="cart-btn">
            🛒 Cart
        </a>

    </div>

</nav>



<!-- =========================
     MAIN
========================= -->

<div class="container">


    <!-- PAGE HEADER -->

    <div class="page-header">

        <h1>
            My Orders 📦
        </h1>

        <p>
            Track and manage your ShopSphere orders.
        </p>

    </div>



    <!-- =========================
         ORDER STATS
    ========================= -->

    <section class="order-stats">


        <div class="stat">

            <div class="stat-icon">
                📦
            </div>

            <div>

                <h3 id="totalOrders">
                    0
                </h3>

                <p>
                    Total Orders
                </p>

            </div>

        </div>


        <div class="stat">

            <div class="stat-icon">
                🚚
            </div>

            <div>

                <h3 id="activeOrders">
                    0
                </h3>

                <p>
                    Active Orders
                </p>

            </div>

        </div>


        <div class="stat">

            <div class="stat-icon">
                💰
            </div>

            <div>

                <h3 id="totalSpent">
                    Rs. 0
                </h3>

                <p>
                    Total Spent
                </p>

            </div>

        </div>

    </section>



    <!-- =========================
         ORDERS
    ========================= -->

    <section class="orders-box">


        <div class="orders-header">

            <h2>
                Order History
            </h2>

            <span id="orderCount">
                0 Orders
            </span>

        </div>


        <!-- ORDERS WILL LOAD HERE -->

        <div id="ordersContainer"></div>


    </section>


</div>



<!-- =========================
     FOOTER
========================= -->

<footer>

    <h3>
        🛒 ShopSphere
    </h3>

    <p>
        Your marketplace for everything you need.
    </p>

    <p>
        © 2026 ShopSphere. All rights reserved.
    </p>

</footer>



<script>

    // ==================================
    // LOAD ORDERS
    // ==================================

    function loadOrders() {

        /*
         * For now orders are stored in localStorage.
         *
         * Later we can replace this with
         * orders from the MySQL database.
         */

        let orders =
            JSON.parse(localStorage.getItem("orders")) || [];


        const container =
            document.getElementById("ordersContainer");


        const orderCount =
            document.getElementById("orderCount");


        const totalOrders =
            document.getElementById("totalOrders");


        const activeOrders =
            document.getElementById("activeOrders");


        const totalSpent =
            document.getElementById("totalSpent");


        // =========================
        // EMPTY ORDERS
        // =========================

        if (orders.length === 0) {

            container.innerHTML = `

                <div class="empty-orders">

                    <div class="empty-icon">
                        📦
                    </div>

                    <h2>
                        No Orders Yet
                    </h2>

                    <p>
                        You haven't placed any orders yet.
                        Start shopping and your orders will appear here.
                    </p>

                    <a
                        href="/products"
                        class="shop-btn">

                        🛍️ Start Shopping

                    </a>

                </div>

            `;


            totalOrders.textContent = "0";
            activeOrders.textContent = "0";
            totalSpent.textContent = "Rs. 0";
            orderCount.textContent = "0 Orders";

            return;
        }



        // =========================
        // CALCULATE STATS
        // =========================

        let spent = 0;

        let active = 0;


        orders.forEach(order => {

            spent += Number(order.total || 0);


            if (
                order.status !== "Delivered" &&
                order.status !== "Cancelled"
            ) {

                active++;

            }

        });


        totalOrders.textContent =
            orders.length;


        activeOrders.textContent =
            active;


        totalSpent.textContent =
            "Rs. " + spent.toLocaleString();


        orderCount.textContent =
            orders.length +
            (orders.length === 1 ? " Order" : " Orders");



        // =========================
        // DISPLAY ORDERS
        // =========================

        container.innerHTML = "";


        orders.forEach((order, index) => {

            const status =
                order.status || "Pending";


            const statusClass =
                status.toLowerCase();


            container.innerHTML += `

                <div class="order-card">


                    <div class="order-top">

                        <div>

                            <div class="order-id">

                                Order #${order.id || (1000 + index)}

                            </div>

                            <div class="order-date">

                                ${order.date || "Recently placed"}

                            </div>

                        </div>


                        <span class="status ${statusClass}">

                            ${status}

                        </span>

                    </div>



                    <div class="product-row">


                        <div class="product-info">

                            <div class="product-image">

                                ${order.icon || "🛍️"}

                            </div>


                            <div>

                                <h3>

                                    ${order.productName || "ShopSphere Product"}

                                </h3>

                                <p>

                                    Quantity:
                                    ${order.quantity || 1}

                                </p>

                            </div>

                        </div>



                        <div class="product-price">

                            <strong>

                                Rs. ${Number(order.total || 0).toLocaleString()}

                            </strong>

                            <span>

                                Order Total

                            </span>

                        </div>


                    </div>



                    <div class="order-bottom">

                        <div>

                            <span class="total-label">

                                Total Amount

                            </span>

                            <div class="total">

                                Rs. ${Number(order.total || 0).toLocaleString()}

                            </div>

                        </div>


                        <a
                            href="#"
                            class="view-btn"
                            onclick="viewOrder(${index})">

                            View Details

                        </a>

                    </div>


                </div>

            `;

        });

    }



    // ==================================
    // VIEW ORDER
    // ==================================

    function viewOrder(index) {

        let orders =
            JSON.parse(localStorage.getItem("orders")) || [];


        if (!orders[index]) {

            return;

        }


        const order =
            orders[index];


        alert(

            "Order #" +
            (order.id || 1000 + index) +
            "\n\n" +

            "Product: " +
            (order.productName || "ShopSphere Product") +
            "\n" +

            "Quantity: " +
            (order.quantity || 1) +
            "\n" +

            "Total: Rs. " +
            Number(order.total || 0).toLocaleString() +
            "\n" +

            "Status: " +
            (order.status || "Pending")

        );

    }



    // ==================================
    // LOAD PAGE
    // ==================================

    loadOrders();

</script>


</body>

</html>
