
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Add Product | ShopSphere</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            background: #f7f7fb;
            color: #202124;
        }


        /* =========================
           NAVBAR
        ========================= */

        .navbar {
            height: 72px;
            background: white;

            display: flex;
            align-items: center;
            justify-content: space-between;

            padding: 0 50px;

            border-bottom: 1px solid #ececf2;
        }

        .logo {
            font-size: 25px;
            font-weight: 800;
            color: #202124;
        }

        .logo span {
            color: #635bff;
        }

        .back {
            text-decoration: none;

            display: flex;
            align-items: center;
            gap: 7px;

            color: #635bff;

            font-size: 13px;
            font-weight: 700;

            padding: 9px 14px;

            border-radius: 8px;

            transition: 0.2s;
        }

        .back:hover {
            background: #f0efff;
        }


        /* =========================
           MAIN CONTAINER
        ========================= */

        .container {
            max-width: 900px;

            margin: 45px auto;

            padding: 0 20px;
        }


        /* =========================
           PAGE HEADING
        ========================= */

        .heading {
            margin-bottom: 25px;
        }

        .badge {
            display: inline-block;

            background: #eeecff;
            color: #635bff;

            font-size: 11px;
            font-weight: 700;

            padding: 6px 11px;

            border-radius: 20px;

            margin-bottom: 12px;
        }

        .heading h1 {
            font-size: 30px;

            margin-bottom: 8px;

            color: #191a1f;
        }

        .heading p {
            color: #777b87;

            font-size: 14px;
        }


        /* =========================
           FORM CARD
        ========================= */

        .form-card {
            background: white;

            border: 1px solid #e8e8ef;

            border-radius: 18px;

            padding: 34px;

            box-shadow:
                0 12px 35px rgba(40, 35, 100, 0.06);
        }


        /* =========================
           SECTION TITLE
        ========================= */

        .section-title {
            font-size: 15px;
            font-weight: 800;

            color: #292a31;

            margin-bottom: 22px;

            padding-bottom: 13px;

            border-bottom: 1px solid #eeeeF3;
        }


        /* =========================
           FORM GROUP
        ========================= */

        .form-group {
            margin-bottom: 21px;
        }

        label {
            display: block;

            font-size: 13px;
            font-weight: 700;

            color: #34363d;

            margin-bottom: 8px;
        }

        .required {
            color: #635bff;
        }


        /* =========================
           INPUTS
        ========================= */

        input,
        textarea,
        select {
            width: 100%;

            padding: 13px 14px;

            border: 1px solid #dedfe7;

            border-radius: 9px;

            outline: none;

            font-size: 13px;

            color: #292a31;

            background: #fff;

            transition: 0.2s;
        }

        input::placeholder,
        textarea::placeholder {
            color: #a2a4ad;
        }

        input:hover,
        textarea:hover,
        select:hover {
            border-color: #c8c7e8;
        }

        input:focus,
        textarea:focus,
        select:focus {
            border-color: #635bff;

            box-shadow:
                0 0 0 3px rgba(99, 91, 255, 0.09);
        }

        textarea {
            min-height: 125px;

            resize: vertical;
        }


        /* =========================
           TWO COLUMN ROW
        ========================= */

        .row {
            display: grid;

            grid-template-columns: 1fr 1fr;

            gap: 20px;
        }


        /* =========================
           IMAGE URL
        ========================= */

        .input-hint {
            display: block;

            margin-top: 7px;

            font-size: 11px;

            color: #999ca7;
        }


        /* =========================
           BUTTONS
        ========================= */

        .button-area {
            margin-top: 30px;

            padding-top: 24px;

            border-top: 1px solid #eeeeF3;

            display: flex;

            gap: 12px;
        }

        .btn {
            border: none;

            padding: 13px 23px;

            border-radius: 9px;

            font-size: 13px;

            font-weight: 700;

            cursor: pointer;

            text-decoration: none;

            transition: 0.2s;
        }

        .submit-btn {
            background: linear-gradient(
                135deg,
                #635bff,
                #756cff
            );

            color: white;

            flex: 1;

            box-shadow:
                0 7px 18px rgba(99, 91, 255, 0.20);
        }

        .submit-btn:hover {
            transform: translateY(-1px);

            box-shadow:
                0 10px 22px rgba(99, 91, 255, 0.28);
        }

        .cancel-btn {
            background: #f1f1f5;

            color: #555963;

            display: flex;

            align-items: center;

            justify-content: center;

            min-width: 100px;
        }

        .cancel-btn:hover {
            background: #e8e8ed;
        }


        /* =========================
           FOOTER NOTE
        ========================= */

        .security-note {
            margin-top: 18px;

            text-align: center;

            font-size: 11px;

            color: #999ca6;
        }


        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 600px) {

            .navbar {
                padding: 0 20px;
            }

            .logo {
                font-size: 21px;
            }

            .back {
                font-size: 12px;
            }

            .container {
                margin: 30px auto;
            }

            .heading h1 {
                font-size: 25px;
            }

            .form-card {
                padding: 22px;

                border-radius: 14px;
            }

            .row {
                grid-template-columns: 1fr;

                gap: 0;
            }

            .button-area {
                flex-direction: column-reverse;
            }

            .cancel-btn {
                width: 100%;
            }

        }

    </style>

</head>


<body>


    <!-- =========================
         NAVBAR
    ========================= -->

    <nav class="navbar">

        <div class="logo">
            🛒 Shop<span>Sphere</span>
        </div>

        <a href="/seller-dashboard" class="back">
            ← Back to Dashboard
        </a>

    </nav>


    <!-- =========================
         MAIN CONTENT
    ========================= -->

    <div class="container">


        <!-- HEADING -->

        <div class="heading">

            <span class="badge">
                SELLER PANEL
            </span>

            <h1>
                Add New Product
            </h1>

            <p>
                Add a new product to your ShopSphere store.
            </p>

        </div>


        <!-- FORM -->

        <div class="form-card">

            <div class="section-title">
                Product Information
            </div>


            <form action="/add-product" method="POST">


                <!-- PRODUCT NAME -->

                <div class="form-group">

                    <label for="name">
                        Product Name <span class="required">*</span>
                    </label>

                    <input
                        type="text"
                        id="name"
                        name="name"
                        placeholder="Enter product name"
                        required
                    >

                </div>


                <!-- DESCRIPTION -->

                <div class="form-group">

                    <label for="description">
                        Product Description
                    </label>

                    <textarea
                        id="description"
                        name="description"
                        placeholder="Describe your product"
                    ></textarea>

                </div>


                <!-- PRICE + STOCK -->

                <div class="row">


                    <div class="form-group">

                        <label for="price">
                            Price (Rs.) <span class="required">*</span>
                        </label>

                        <input
                            type="number"
                            id="price"
                            name="price"
                            placeholder="Enter price"
                            min="0"
                            step="0.01"
                            required
                        >

                    </div>


                    <div class="form-group">

                        <label for="stock">
                            Stock Quantity <span class="required">*</span>
                        </label>

                        <input
                            type="number"
                            id="stock"
                            name="stock"
                            placeholder="Enter stock"
                            min="0"
                            required
                        >

                    </div>


                </div>


                <!-- CATEGORY -->

                <div class="form-group">

                    <label for="category">
                        Category <span class="required">*</span>
                    </label>

                    <select
                        id="category"
                        name="category"
                        required
                    >

                        <option value="">
                            Select Category
                        </option>

                        <option value="Electronics">
                            Electronics
                        </option>

                        <option value="Fashion">
                            Fashion
                        </option>

                        <option value="Beauty">
                            Beauty
                        </option>

                        <option value="Home">
                            Home & Living
                        </option>

                        <option value="Sports">
                            Sports
                        </option>

                        <option value="Books">
                            Books
                        </option>

                        <option value="Other">
                            Other
                        </option>

                    </select>

                </div>


                <!-- IMAGE -->

                <div class="form-group">

                    <label for="image_url">
                        Product Image URL
                    </label>

                    <input
                        type="text"
                        id="image_url"
                        name="image_url"
                        placeholder="https://example.com/product-image.jpg"
                    >

                    <span class="input-hint">
                        Add a direct URL to your product image.
                    </span>

                </div>


                <!-- BUTTONS -->

                <div class="button-area">

                    <a
                        href="/seller-dashboard"
                        class="btn cancel-btn"
                    >
                        Cancel
                    </a>

                    <button
                        type="submit"
                        class="btn submit-btn"
                    >
                        + Add Product
                    </button>

                </div>


            </form>


        </div>


        <div class="security-note">
            🔒 Your product information will be securely stored in ShopSphere.
        </div>


    </div>


</body>

</html>
