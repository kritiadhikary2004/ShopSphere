<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Add Product | ShopSphere</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            background: #f5f6fa;
            color: #202124;
        }

        .navbar {
            height: 70px;
            background: white;

            display: flex;
            align-items: center;
            justify-content: space-between;

            padding: 0 40px;

            border-bottom: 1px solid #e5e6eb;
        }

        .logo {
            font-size: 24px;
            font-weight: 800;
        }

        .logo span {
            color: #6558f5;
        }

        .back {
            text-decoration: none;
            color: #6558f5;
            font-size: 13px;
            font-weight: 600;
        }

        .container {
            max-width: 850px;
            margin: 45px auto;
            padding: 0 20px;
        }

        .heading {
            margin-bottom: 25px;
        }

        .heading h1 {
            font-size: 28px;
            margin-bottom: 7px;
        }

        .heading p {
            color: #7b7f89;
            font-size: 13px;
        }

        .form-card {
            background: white;
            border: 1px solid #e5e6eb;
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.04);
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;

            font-size: 13px;
            font-weight: 700;

            color: #34363d;

            margin-bottom: 8px;
        }

        input,
        textarea,
        select {
            width: 100%;

            padding: 12px 13px;

            border: 1px solid #dfe1e7;

            border-radius: 8px;

            outline: none;

            font-size: 13px;

            color: #333;

            background: white;
        }

        input:focus,
        textarea:focus,
        select:focus {
            border-color: #6558f5;

            box-shadow: 0 0 0 3px rgba(101, 88, 245, 0.08);
        }

        textarea {
            min-height: 120px;
            resize: vertical;
        }

        .row {
            display: grid;

            grid-template-columns: 1fr 1fr;

            gap: 18px;
        }

        .button-area {
            margin-top: 28px;

            display: flex;

            gap: 12px;
        }

        .btn {
            border: none;

            padding: 13px 22px;

            border-radius: 9px;

            font-size: 13px;

            font-weight: 700;

            cursor: pointer;
        }

        .submit-btn {
            background: #6558f5;
            color: white;

            flex: 1;
        }

        .submit-btn:hover {
            background: #5548e8;
        }

        .cancel-btn {
            background: #f0f1f4;
            color: #555963;

            text-decoration: none;

            display: flex;
            align-items: center;
            justify-content: center;
        }

        .cancel-btn:hover {
            background: #e6e7eb;
        }

        @media(max-width: 600px) {

            .navbar {
                padding: 0 20px;
            }

            .container {
                margin: 30px auto;
            }

            .form-card {
                padding: 22px;
            }

            .row {
                grid-template-columns: 1fr;
                gap: 0;
            }

            .button-area {
                flex-direction: column;
            }

        }

    </style>

</head>


<body>


    <nav class="navbar">

        <div class="logo">
            🛒 Shop<span>Sphere</span>
        </div>

        <a href="/seller-dashboard" class="back">
            ← Back to Dashboard
        </a>

    </nav>


    <div class="container">

        <div class="heading">

            <h1>
                Add New Product
            </h1>

            <p>
                Add a new product to your ShopSphere store.
            </p>

        </div>


        <div class="form-card">

            <form action="/add-product" method="POST">


                <div class="form-group">

                    <label for="name">
                        Product Name
                    </label>

                    <input
                        type="text"
                        id="name"
                        name="name"
                        placeholder="Enter product name"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="description">
                        Product Description
                    </label>

                    <textarea
                        id="description"
                        name="description"
                        placeholder="Describe your product"
                    ></textarea>

                </div>


                <div class="row">


                    <div class="form-group">

                        <label for="price">
                            Price (Rs.)
                        </label>

                        <input
                            type="number"
                            id="price"
                            name="price"
                            placeholder="Enter price"
                            min="0"
                            step="0.01"
                            required
                        >

                    </div>


                    <div class="form-group">

                        <label for="stock">
                            Stock Quantity
                        </label>

                        <input
                            type="number"
                            id="stock"
                            name="stock"
                            placeholder="Enter stock"
                            min="0"
                            required
                        >

                    </div>

                </div>


                <div class="form-group">

                    <label for="category">
                        Category
                    </label>

                    <select id="category" name="category" required>

                        <option value="">
                            Select Category
                        </option>

                        <option value="Electronics">
                            Electronics
                        </option>

                        <option value="Fashion">
                            Fashion
                        </option>

                        <option value="Beauty">
                            Beauty
                        </option>

                        <option value="Home">
                            Home & Living
                        </option>

                        <option value="Sports">
                            Sports
                        </option>

                        <option value="Books">
                            Books
                        </option>

                        <option value="Other">
                            Other
                        </option>

                    </select>

                </div>


                <div class="form-group">

                    <label for="image_url">
                        Product Image URL
                    </label>

                    <input
                        type="text"
                        id="image_url"
                        name="image_url"
                        placeholder="Enter image URL"
                    >

                </div>


                <div class="button-area">

                    <a
                        href="/seller-dashboard"
                        class="btn cancel-btn"
                    >
                        Cancel
                    </a>

                    <button
                        type="submit"
                        class="btn submit-btn"
                    >
                        + Add Product
                    </button>

                </div>


            </form>

        </div>

    </div>


</body>

</html>
