<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Customer Dashboard | ShopSphere</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            background: #f7f8ff;
            color: #222;
        }

        nav {
            height: 70px;
            background: white;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 7%;
            box-shadow: 0 2px 15px rgba(0,0,0,0.06);
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
            color: #5b5cf0;
        }

        .logout {
            text-decoration: none;
            color: #5b5cf0;
            border: 1px solid #5b5cf0;
            padding: 9px 18px;
            border-radius: 8px;
        }

        .dashboard {
            padding: 60px 7%;
        }

        .welcome {
            margin-bottom: 40px;
        }

        .welcome h1 {
            font-size: 36px;
            margin-bottom: 10px;
        }

        .welcome p {
            color: #777;
        }

        .cards {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 25px;
        }

        .card {
            background: white;
            padding: 30px;
            border-radius: 18px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.06);
            text-align: center;
        }

        .card-icon {
            font-size: 45px;
            margin-bottom: 15px;
        }

        .card h2 {
            margin-bottom: 10px;
        }

        .card p {
            color: #777;
            font-size: 14px;
            line-height: 1.6;
        }

        @media(max-width: 750px) {
            .cards {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

    <nav>

        <div class="logo">
            🛒 ShopSphere
        </div>

        <a href="/" class="logout">
            Logout
        </a>

    </nav>


    <section class="dashboard">

        <div class="welcome">

            <h1>
                Welcome, Customer! 👋
            </h1>

            <p>
                Explore products and enjoy your shopping experience.
            </p>

        </div>


        <div class="cards">

            <div class="card">

                <div class="card-icon">
                    🛍️
                </div>

                <h2>
                    Browse Products
                </h2>

                <p>
                    Explore products from different sellers.
                </p>

            </div>


            <div class="card">

                <div class="card-icon">
                    📦
                </div>

                <h2>
                    My Orders
                </h2>

                <p>
                    View and track your orders easily.
                </p>

            </div>


            <div class="card">

                <div class="card-icon">
                    ❤️
                </div>

                <h2>
                    Wishlist
                </h2>

                <p>
                    Save your favorite products for later.
                </p>

            </div>

        </div>

    </section>

</body>

</html>
