
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Details | ShopSphere</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Segoe UI", Arial, sans-serif;
        }

        :root {
            --primary: #6256e8;
            --primary-dark: #4d42d0;
            --light-purple: #f0efff;
            --text: #24243a;
            --muted: #777b8c;
            --border: #e9e8f2;
            --background: #f7f7fc;
        }

        body {
            background: var(--background);
            color: var(--text);
            min-height: 100vh;
        }

        a {
            text-decoration: none;
        }

        /* NAVBAR */

        .navbar {
            height: 76px;
            padding: 0 7%;
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #fff;
            border-bottom: 1px solid var(--border);
            position: sticky;
            top: 0;
            z-index: 10;
        }

        .logo {
            font-size: 25px;
            font-weight: 800;
            color: var(--text);
            letter-spacing: -0.8px;
        }

        .logo span {
            color: var(--primary);
        }

        .nav-link {
            color: var(--text);
            font-size: 14px;
            font-weight: 600;
            padding: 11px 17px;
            border-radius: 10px;
            transition: 0.25s;
        }

        .nav-link:hover {
            color: var(--primary);
            background: var(--light-purple);
        }

        /* MAIN CONTAINER */

        .container {
            max-width: 1120px;
            margin: 45px auto 70px;
            padding: 0 24px;
        }

        .breadcrumb {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 25px;
            color: var(--muted);
            font-size: 13px;
        }

        .breadcrumb a {
            color: var(--primary);
            font-weight: 600;
        }

        .breadcrumb a:hover {
            text-decoration: underline;
        }

        /* PRODUCT CARD */

        .details-card {
            display: grid;
            grid-template-columns: 1.05fr 1fr;
            gap: 48px;
            background: #fff;
            border: 1px solid var(--border);
            border-radius: 24px;
            padding: 35px;
            box-shadow: 0 15px 45px rgba(54, 45, 120, 0.06);
            animation: appear 0.5s ease;
        }

        @keyframes appear {
            from {
                opacity: 0;
                transform: translateY(12px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* IMAGE AREA */

        .image-area {
            position: relative;
            min-width: 0;
        }

        .image-frame {
            width: 100%;
            height: 440px;
            padding: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(145deg, #f6f4ff, #f5f7ff);
            border-radius: 18px;
            overflow: hidden;
        }

        .product-image {
            width: 100%;
            height: 100%;
            object-fit: contain;
            mix-blend-mode: multiply;
            transition: transform 0.4s ease;
        }

        .image-frame:hover .product-image {
            transform: scale(1.04);
        }

        .image-caption {
            text-align: center;
            margin-top: 15px;
            font-size: 12px;
            color: var(--muted);
        }

        /* PRODUCT INFORMATION */

        .product-info {
            display: flex;
            flex-direction: column;
            justify-content: center;
            min-width: 0;
            padding: 8px 0;
        }

        .top-labels {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 10px;
            margin-bottom: 23px;
        }

        .category {
            display: inline-block;
            background: var(--light-purple);
            color: var(--primary-dark);
            padding: 8px 13px;
            border-radius: 8px;
            font-size: 11px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.6px;
        }

        .stock-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 11px;
            font-weight: 700;
            color: #238454;
            background: #eaf8f0;
            padding: 8px 11px;
            border-radius: 8px;
        }

        .stock-badge.out {
            color: #c03939;
            background: #fff0f0;
        }

        .stock-dot {
            width: 7px;
            height: 7px;
            background: currentColor;
            border-radius: 50%;
        }

        h1 {
            font-size: clamp(27px, 3vw, 37px);
            line-height: 1.25;
            letter-spacing: -1px;
            margin-bottom: 17px;
            overflow-wrap: anywhere;
        }

        .small-heading {
            color: var(--muted);
            font-size: 12px;
            font-weight: 600;
            margin-bottom: 7px;
        }

        .price {
            font-size: 34px;
            font-weight: 800;
            color: var(--primary);
            letter-spacing: -1px;
            margin-bottom: 23px;
        }

        .price-prefix {
            font-size: 16px;
            font-weight: 700;
            letter-spacing: 0;
        }

        .section-divider {
            height: 1px;
            background: var(--border);
            margin-bottom: 22px;
        }

        .description-title {
            font-size: 14px;
            font-weight: 800;
            margin-bottom: 10px;
        }

        .description {
            font-size: 14px;
            line-height: 1.9;
            color: var(--muted);
            margin-bottom: 26px;
            overflow-wrap: anywhere;
            white-space: pre-wrap;
        }

        .stock-info {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 15px;
            background: #faf9ff;
            border: 1px solid #eeecff;
            border-radius: 12px;
            margin-bottom: 25px;
        }

        .stock-icon {
            width: 38px;
            height: 38px;
            flex-shrink: 0;
            display: grid;
            place-items: center;
            background: #e9e6ff;
            border-radius: 10px;
            font-size: 18px;
        }

        .stock-text strong {
            display: block;
            font-size: 13px;
            margin-bottom: 4px;
        }

        .stock-text span {
            font-size: 12px;
            color: var(--muted);
        }

        /* BUTTONS */

        .actions {
            display: flex;
            gap: 12px;
        }

        .back-button {
            flex: 1;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 9px;
            min-height: 50px;
            padding: 13px 18px;
            color: #fff;
            background: var(--primary);
            border: 1px solid var(--primary);
            border-radius: 11px;
            font-size: 13px;
            font-weight: 700;
            transition: 0.25s;
            box-shadow: 0 7px 18px rgba(98, 86, 232, 0.19);
        }

        .back-button:hover {
            background: var(--primary-dark);
            transform: translateY(-2px);
            box-shadow: 0 10px 22px rgba(98, 86, 232, 0.25);
        }

        .secondary-button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-height: 50px;
            padding: 13px 18px;
            color: var(--text);
            background: #fff;
            border: 1px solid var(--border);
            border-radius: 11px;
            font-size: 13px;
            font-weight: 700;
            transition: 0.25s;
        }

        .secondary-button:hover {
            border-color: var(--primary);
            color: var(--primary);
        }

        /* MESSAGE / LOADING */

        .message {
            background: #fff;
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 65px 25px;
            text-align: center;
            box-shadow: 0 12px 35px rgba(54, 45, 120, 0.05);
        }

        .message-icon {
            font-size: 42px;
            margin-bottom: 17px;
        }

        .message h2 {
            font-size: 24px;
            margin-bottom: 12px;
        }

        .message p {
            color: var(--muted);
            font-size: 14px;
            line-height: 1.8;
            margin-bottom: 20px;
        }

        .loading-spinner {
            width: 36px;
            height: 36px;
            border: 4px solid #e8e5ff;
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 18px;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* FOOTER */

        footer {
            text-align: center;
            padding: 25px 20px;
            border-top: 1px solid var(--border);
            background: #fff;
            color: var(--muted);
            font-size: 12px;
        }

        footer span {
            color: var(--primary);
            font-weight: 700;
        }

        /* RESPONSIVE DESIGN */

        @media (max-width: 850px) {
            .navbar {
                padding: 0 5%;
            }

            .container {
                margin-top: 30px;
            }

            .details-card {
                grid-template-columns: 1fr;
                gap: 28px;
                padding: 25px;
            }

            .image-frame {
                height: 350px;
            }

            .product-info {
                padding: 0;
            }

            h1 {
                font-size: 30px;
            }
        }

        @media (max-width: 480px) {
            .navbar {
                height: 66px;
                padding: 0 18px;
            }

            .logo {
                font-size: 21px;
            }

            .nav-link {
                font-size: 12px;
                padding: 9px;
            }

            .container {
                margin: 22px auto 40px;
                padding: 0 14px;
            }

            .breadcrumb {
                font-size: 12px;
                margin-bottom: 18px;
            }

            .details-card {
                padding: 16px;
                border-radius: 17px;
                gap: 24px;
            }

            .image-frame {
                height: 270px;
                padding: 12px;
                border-radius: 13px;
            }

            .top-labels {
                margin-bottom: 17px;
            }

            h1 {
                font-size: 26px;
            }

            .price {
                font-size: 30px;
            }

            .actions {
                flex-direction: column;
            }

            .back-button,
            .secondary-button {
                width: 100%;
            }
        }
    </style>
</head>

<body>

    <nav class="navbar">
        <a href="/" class="logo">🛒 Shop<span>Sphere</span></a>
        <a href="/products" class="nav-link">← All Products</a>
    </nav>

    <main class="container">

        <div class="breadcrumb">
            <a href="/">Home</a>
            <span>/</span>
            <a href="/products">Products</a>
            <span>/</span>
            <span>Details</span>
        </div>

        <div id="productDetails">
            <div class="message">
                <div class="loading-spinner"></div>
                <h2>Loading product...</h2>
                <p>Please wait while we fetch the product details.</p>
            </div>
        </div>

    </main>

    <footer>
        © 2026 <span>ShopSphere</span>. Everything you need, all in one place.
    </footer>

    <script>
        function escapeHTML(value) {
            return String(value).replace(/[&<>"']/g, character => ({
                "&": "&amp;",
                "<": "&lt;",
                ">": "&gt;",
                '"': "&quot;",
                "'": "&#39;"
            })[character]);
        }

        async function loadProductDetails() {
            const container = document.getElementById("productDetails");
            const params = new URLSearchParams(window.location.search);
            const id = params.get("id");

            if (!id || !/^\d+$/.test(id) || Number(id) <= 0) {
                container.innerHTML = `
                    <div class="message">
                        <div class="message-icon">🔎</div>
                        <h2>Invalid Product</h2>
                        <p>Please select a valid product from our products page.</p>
                        <a href="/products" class="back-button">Browse Products</a>
                    </div>
                `;
                return;
            }

            try {
                const response = await fetch(
                    `/api/products/${encodeURIComponent(id)}`
                );

                const product = await response.json();

                if (!response.ok) {
                    throw new Error(
                        product.message || "Product not found."
                    );
                }

                const image = product.image_url ||
                    "https://placehold.co/600x400?text=No+Product+Image";

                const stock = Number(product.stock) || 0;
                const inStock = stock > 0;
                const price = Number(product.price);

                container.innerHTML = `
                    <section class="details-card">

                        <div class="image-area">
                            <div class="image-frame">
                                <img
                                    class="product-image"
                                    src="${escapeHTML(image)}"
                                    alt="${escapeHTML(product.name || "Product")}"
                                    onerror="this.onerror=null;this.src='https://placehold.co/600x400?text=No+Product+Image';"
                                >
                            </div>

                            <p class="image-caption">
                                Discover quality products at ShopSphere
                            </p>
                        </div>

                        <div class="product-info">

                            <div class="top-labels">
                                <span class="category">
                                    ${escapeHTML(product.category || "Other")}
                                </span>

                                <span class="stock-badge ${inStock ? "" : "out"}">
                                    <span class="stock-dot"></span>
                                    ${inStock ? "In Stock" : "Out of Stock"}
                                </span>
                            </div>

                            <h1>${escapeHTML(product.name || "Unnamed Product")}</h1>

                            <p class="small-heading">OUR PRICE</p>

                            <div class="price">
                                <span class="price-prefix">Rs.</span>
                                ${Number.isFinite(price) ? price.toLocaleString("en-IN", {
                                    minimumFractionDigits: 2,
                                    maximumFractionDigits: 2
                                }) : "0.00"}
                            </div>

                            <div class="section-divider"></div>

                            <h3 class="description-title">Product Description</h3>

                            <p class="description">${escapeHTML(
                                product.description || "No description available for this product yet."
                            )}</p>

                            <div class="stock-info">
                                <div class="stock-icon">
                                    ${inStock ? "📦" : "ℹ️"}
                                </div>

                                <div class="stock-text">
                                    <strong>${inStock
                                        ? `${stock} item${stock === 1 ? "" : "s"} available`
                                        : "Currently unavailable"
                                    }</strong>

                                    <span>${inStock
                                        ? "This product is available in stock."
                                        : "Please explore our other available products."
                                    }</span>
                                </div>
                            </div>

                            <div class="actions">
                                <a href="/products" class="back-button">
                                    ← Continue Shopping
                                </a>

                                <a href="/" class="secondary-button">
                                    Home
                                </a>
                            </div>

                        </div>
                    </section>
                `;

            } catch (error) {
                console.error("Product details error:", error);

                container.innerHTML = `
                    <div class="message">
                        <div class="message-icon">📦</div>
                        <h2>Product Not Found</h2>
                        <p>${escapeHTML(error.message || "Unable to load product details.")}</p>
                        <a href="/products" class="back-button">Back to Products</a>
                    </div>
                `;
            }
        }

        loadProductDetails();
    </script>

</body>
</html>
