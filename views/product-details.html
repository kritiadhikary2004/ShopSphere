<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Details | ShopSphere</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Segoe UI", Arial, sans-serif;
        }

        :root {
            --primary: #6256e8;
            --primary-dark: #4d42d0;
            --light-purple: #f0efff;
            --text: #24243a;
            --muted: #777b8c;
            --border: #e9e8f2;
            --background: #f7f7fc;
            --success: #218653;
            --danger: #d94343;
        }

        body {
            background: var(--background);
            color: var(--text);
            min-height: 100vh;
        }

        a {
            color: inherit;
            text-decoration: none;
        }

        button {
            font: inherit;
        }

        /* NAVBAR */

        .navbar {
            min-height: 76px;
            padding: 0 7%;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
            background: #fff;
            border-bottom: 1px solid var(--border);
            position: sticky;
            top: 0;
            z-index: 10;
        }

        .logo {
            font-size: 25px;
            font-weight: 800;
            letter-spacing: -0.8px;
            white-space: nowrap;
        }

        .logo span {
            color: var(--primary);
        }

        .nav-links {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .nav-link {
            color: var(--text);
            font-size: 14px;
            font-weight: 600;
            padding: 11px 15px;
            border-radius: 10px;
            transition: 0.25s;
        }

        .nav-link:hover,
        .nav-link.active {
            color: var(--primary);
            background: var(--light-purple);
        }

        /* MAIN */

        .container {
            max-width: 1200px;
            margin: 35px auto 60px;
            padding: 0 24px;
        }

        .breadcrumb {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 10px;
            margin-bottom: 24px;
            color: var(--muted);
            font-size: 13px;
        }

        .breadcrumb a {
            color: var(--primary);
            font-weight: 600;
        }

        .breadcrumb a:hover {
            text-decoration: underline;
        }

        /* PRODUCT CARD */

        .details-card {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 45px;
            background: #fff;
            border: 1px solid var(--border);
            border-radius: 22px;
            padding: 32px;
            box-shadow: 0 12px 40px rgba(54, 45, 120, 0.06);
            animation: appear 0.45s ease;
        }

        @keyframes appear {
            from {
                opacity: 0;
                transform: translateY(12px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* IMAGE */

        .image-area {
            min-width: 0;
        }

        .image-frame {
            height: 420px;
            padding: 22px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(145deg, #f0efff, #f8f8ff);
            border-radius: 18px;
            overflow: hidden;
        }

        .product-image {
            width: 100%;
            height: 100%;
            object-fit: contain;
            mix-blend-mode: multiply;
            transition: transform 0.4s ease;
        }

        .image-frame:hover .product-image {
            transform: scale(1.05);
        }

        .image-caption {
            margin-top: 14px;
            text-align: center;
            color: var(--muted);
            font-size: 12px;
        }

        .image-placeholder {
            font-size: 75px;
            color: var(--primary);
        }

        /* PRODUCT INFORMATION */

        .product-info {
            min-width: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 5px 0;
        }

        .top-labels {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 20px;
        }

        .category {
            padding: 8px 12px;
            background: var(--light-purple);
            color: var(--primary-dark);
            border-radius: 8px;
            font-size: 11px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .stock-badge {
            display: inline-flex;
            align-items: center;
            gap: 7px;
            padding: 8px 11px;
            border-radius: 8px;
            background: #eaf8f0;
            color: var(--success);
            font-size: 11px;
            font-weight: 700;
        }

        .stock-badge.out {
            background: #fff0f0;
            color: var(--danger);
        }

        .stock-dot {
            width: 7px;
            height: 7px;
            background: currentColor;
            border-radius: 50%;
        }

        h1 {
            font-size: clamp(27px, 3vw, 38px);
            line-height: 1.25;
            letter-spacing: -0.8px;
            overflow-wrap: anywhere;
            margin-bottom: 12px;
        }

        .small-heading {
            color: var(--muted);
            font-size: 12px;
            font-weight: 600;
            margin-bottom: 7px;
        }

        .price {
            color: var(--primary);
            font-size: 34px;
            font-weight: 800;
            letter-spacing: -0.8px;
            margin-bottom: 22px;
            overflow-wrap: anywhere;
        }

        .price-prefix {
            font-size: 16px;
            letter-spacing: 0;
        }

        .section-divider {
            height: 1px;
            background: var(--border);
            margin-bottom: 20px;
        }

        .description-title {
            font-size: 15px;
            font-weight: 800;
            margin-bottom: 10px;
        }

        .description {
            color: var(--muted);
            font-size: 14px;
            line-height: 1.9;
            white-space: pre-wrap;
            overflow-wrap: anywhere;
            margin-bottom: 23px;
        }

        /* STOCK INFORMATION */

        .stock-info {
            display: flex;
            align-items: center;
            gap: 13px;
            padding: 15px;
            background: #faf9ff;
            border: 1px solid #eeecff;
            border-radius: 12px;
            margin-bottom: 24px;
        }

        .stock-icon {
            width: 42px;
            height: 42px;
            flex-shrink: 0;
            display: grid;
            place-items: center;
            background: #e9e6ff;
            border-radius: 11px;
            font-size: 20px;
        }

        .stock-text strong {
            display: block;
            font-size: 13px;
            margin-bottom: 5px;
        }

        .stock-text span {
            color: var(--muted);
            font-size: 12px;
            line-height: 1.6;
        }

        /* PRODUCT HIGHLIGHTS */

        .highlights {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            margin-bottom: 25px;
        }

        .highlight {
            display: flex;
            align-items: center;
            gap: 9px;
            min-width: 0;
        }

        .highlight-icon {
            width: 37px;
            height: 37px;
            flex-shrink: 0;
            display: grid;
            place-items: center;
            border-radius: 10px;
            background: var(--light-purple);
            font-size: 17px;
        }

        .highlight strong {
            display: block;
            font-size: 11px;
            margin-bottom: 4px;
        }

        .highlight span {
            color: var(--muted);
            font-size: 10px;
            line-height: 1.5;
        }

        /* BUTTONS */

        .actions {
            display: flex;
            gap: 12px;
        }

        .button {
            min-height: 50px;
            padding: 13px 18px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 9px;
            border-radius: 11px;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.25s;
        }

        .primary-button {
            flex: 1;
            color: #fff;
            background: var(--primary);
            border: 1px solid var(--primary);
            box-shadow: 0 7px 18px rgba(98, 86, 232, 0.18);
        }

        .primary-button:hover:not(:disabled) {
            background: var(--primary-dark);
            transform: translateY(-2px);
        }

        .primary-button:disabled {
            cursor: not-allowed;
            opacity: 0.55;
            box-shadow: none;
        }

        .secondary-button {
            color: var(--text);
            background: #fff;
            border: 1px solid var(--border);
        }

        .secondary-button:hover {
            color: var(--primary);
            border-color: var(--primary);
        }

        /* LOADING AND ERROR */

        .message {
            background: #fff;
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 65px 25px;
            text-align: center;
            box-shadow: 0 12px 35px rgba(54, 45, 120, 0.05);
        }

        .message-icon {
            font-size: 42px;
            margin-bottom: 17px;
        }

        .message h2 {
            font-size: 24px;
            margin-bottom: 12px;
        }

        .message p {
            color: var(--muted);
            font-size: 14px;
            line-height: 1.8;
            margin-bottom: 22px;
        }

        .loading-spinner {
            width: 36px;
            height: 36px;
            border: 4px solid #e8e5ff;
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 18px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* EXTRA DETAILS */

        .extra-card {
            background: #fff;
            border: 1px solid var(--border);
            border-radius: 18px;
            padding: 28px;
            margin-top: 24px;
            box-shadow: 0 8px 28px rgba(54, 45, 120, 0.035);
        }

        .extra-card h2 {
            font-size: 19px;
            margin-bottom: 18px;
        }

        .feature-list {
            list-style: none;
            display: grid;
            gap: 13px;
        }

        .feature-list li {
            display: flex;
            gap: 10px;
            align-items: flex-start;
            color: var(--muted);
            font-size: 13px;
            line-height: 1.7;
        }

        .check {
            color: var(--primary);
            font-weight: 800;
        }

        .details-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
        }

        .detail-item {
            padding: 15px;
            background: #faf9ff;
            border: 1px solid var(--border);
            border-radius: 12px;
        }

        .detail-item span {
            display: block;
            color: var(--muted);
            font-size: 12px;
            margin-bottom: 6px;
        }

        .detail-item strong {
            font-size: 14px;
            overflow-wrap: anywhere;
        }

        .extra-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 24px;
        }

        /* FOOTER */

        footer {
            text-align: center;
            padding: 25px 20px;
            border-top: 1px solid var(--border);
            background: #fff;
            color: var(--muted);
            font-size: 12px;
        }

        footer span {
            color: var(--primary);
            font-weight: 700;
        }

        /* RESPONSIVE */

        @media (max-width: 900px) {
            .navbar {
                padding: 15px 5%;
                flex-wrap: wrap;
            }

            .details-card {
                grid-template-columns: 1fr;
                gap: 28px;
                padding: 25px;
            }

            .image-frame {
                height: 370px;
            }

            .product-info {
                padding: 0;
            }

            .extra-grid {
                grid-template-columns: 1fr;
            }
        }

        @media (max-width: 520px) {
            .navbar {
                min-height: 65px;
                padding: 12px 16px;
                gap: 10px;
            }

            .logo {
                font-size: 21px;
            }

            .nav-link {
                font-size: 12px;
                padding: 9px;
            }

            .container {
                margin: 23px auto 40px;
                padding: 0 14px;
            }

            .breadcrumb {
                font-size: 12px;
                margin-bottom: 17px;
            }

            .details-card {
                padding: 16px;
                border-radius: 17px;
                gap: 23px;
            }

            .image-frame {
                height: 275px;
                padding: 12px;
                border-radius: 13px;
            }

            h1 {
                font-size: 27px;
            }

            .price {
                font-size: 30px;
            }

            .highlights {
                grid-template-columns: 1fr;
                gap: 13px;
            }

            .actions {
                flex-direction: column;
            }

            .button {
                width: 100%;
            }

            .extra-card {
                padding: 20px;
            }

            .details-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

    <nav class="navbar">
        <a href="/" class="logo">🛒 Shop<span>Sphere</span></a>

        <div class="nav-links">
            <a href="/" class="nav-link">Home</a>
            <a href="/products" class="nav-link active">Products</a>
        </div>
    </nav>

    <main class="container">

        <div class="breadcrumb">
            <a href="/">Home</a>
            <span>›</span>
            <a href="/products">Products</a>
            <span>›</span>
            <span>Product Details</span>
        </div>

        <div id="productDetails">
            <div class="message">
                <div class="loading-spinner"></div>
                <h2>Loading product...</h2>
                <p>Please wait while we fetch the product details.</p>
            </div>
        </div>

        <div id="extraDetails" hidden></div>

    </main>

    <footer>
        © 2026 <span>ShopSphere</span>. Everything you need, all in one place.
    </footer>

    <script>
        function escapeHTML(value) {
            return String(value ?? "").replace(/[&<>"']/g, character => ({
                "&": "&amp;",
                "<": "&lt;",
                ">": "&gt;",
                '"': "&quot;",
                "'": "&#39;"
            })[character]);
        }

        function formatPrice(value) {
            const price = Number(value);

            if (!Number.isFinite(price)) {
                return "0.00";
            }

            return price.toLocaleString("en-IN", {
                minimumFractionDigits: 2,
                maximumFractionDigits: 2
            });
        }

        async function loadProductDetails() {
            const container = document.getElementById("productDetails");
            const extra = document.getElementById("extraDetails");

            const params = new URLSearchParams(window.location.search);
            const id = params.get("id");

            if (!id || !/^\d+$/.test(id) || Number(id) <= 0) {
                showError(
                    container,
                    "Invalid Product",
                    "Please select a valid product from the products page."
                );
                return;
            }

            try {
                const response = await fetch(
                    `/api/products/${encodeURIComponent(id)}`
                );

                const product = await response.json();

                if (!response.ok) {
                    throw new Error(
                        product.message || "Product not found."
                    );
                }

                const name = product.name || "Unnamed Product";
                const category = product.category || "Other";
                const description = product.description ||
                    "No description available for this product yet.";
                const stock = Math.max(0, Number(product.stock) || 0);
                const inStock = stock > 0;

                const image = product.image_url ||
                    "https://placehold.co/600x400?text=No+Product+Image";

                container.innerHTML = `
                    <section class="details-card">

                        <div class="image-area">
                            <div class="image-frame">
                                <img
                                    class="product-image"
                                    src="${escapeHTML(image)}"
                                    alt="${escapeHTML(name)}"
                                    onerror="this.onerror=null;this.src='https://placehold.co/600x400?text=No+Product+Image';"
                                >
                            </div>

                            <p class="image-caption">
                                Discover quality products at ShopSphere
                            </p>
                        </div>

                        <div class="product-info">

                            <div class="top-labels">
                                <span class="category">
                                    ${escapeHTML(category)}
                                </span>

                                <span class="stock-badge ${inStock ? "" : "out"}">
                                    <span class="stock-dot"></span>
                                    ${inStock ? "In Stock" : "Out of Stock"}
                                </span>
                            </div>

                            <h1>${escapeHTML(name)}</h1>

                            <p class="small-heading">OUR PRICE</p>

                            <div class="price">
                                <span class="price-prefix">Rs.</span>
                                ${formatPrice(product.price)}
                            </div>

                            <div class="section-divider"></div>

                            <h3 class="description-title">
                                Product Description
                            </h3>

                            <p class="description">${escapeHTML(description)}</p>

                            <div class="highlights">
                                <div class="highlight">
                                    <div class="highlight-icon">✦</div>
                                    <div>
                                        <strong>Quality Products</strong>
                                        <span>Selected for you</span>
                                    </div>
                                </div>

                                <div class="highlight">
                                    <div class="highlight-icon">🛡️</div>
                                    <div>
                                        <strong>Secure Shopping</strong>
                                        <span>Shop with confidence</span>
                                    </div>
                                </div>

                                <div class="highlight">
                                    <div class="highlight-icon">📦</div>
                                    <div>
                                        <strong>Stock Status</strong>
                                        <span>${inStock ? "Available now" : "Currently unavailable"}</span>
                                    </div>
                                </div>
                            </div>

                            <div class="stock-info">
                                <div class="stock-icon">
                                    ${inStock ? "📦" : "ℹ️"}
                                </div>

                                <div class="stock-text">
                                    <strong>
                                        ${inStock
                                            ? `${stock} item${stock === 1 ? "" : "s"} available`
                                            : "Currently unavailable"}
                                    </strong>

                                    <span>
                                        ${inStock
                                            ? "This product is available in stock."
                                            : "Please explore our other products."}
                                    </span>
                                </div>
                            </div>

                            <div class="actions">
                                <a href="/products" class="button primary-button">
                                    ← Continue Shopping
                                </a>

                                <a href="/" class="button secondary-button">
                                    Home
                                </a>
                            </div>

                        </div>
                    </section>
                `;

                extra.hidden = false;

                extra.innerHTML = `
                    <div class="extra-grid">

                        <section class="extra-card">
                            <h2>Product Highlights</h2>

                            <ul class="feature-list">
                                <li>
                                    <span class="check">✓</span>
                                    <span>Product information displayed directly from your database.</span>
                                </li>

                                <li>
                                    <span class="check">✓</span>
                                    <span>Clear product pricing and availability information.</span>
                                </li>

                                <li>
                                    <span class="check">✓</span>
                                    <span>Responsive design for desktop, tablet and mobile.</span>
                                </li>

                                <li>
                                    <span class="check">✓</span>
                                    <span>Automatic fallback image when a product image is unavailable.</span>
                                </li>
                            </ul>
                        </section>

                        <section class="extra-card">
                            <h2>Product Information</h2>

                            <div class="details-grid">
                                <div class="detail-item">
                                    <span>Product Name</span>
                                    <strong>${escapeHTML(name)}</strong>
                                </div>

                                <div class="detail-item">
                                    <span>Category</span>
                                    <strong>${escapeHTML(category)}</strong>
                                </div>

                                <div class="detail-item">
                                    <span>Price</span>
                                    <strong>Rs. ${formatPrice(product.price)}</strong>
                                </div>

                                <div class="detail-item">
                                    <span>Availability</span>
                                    <strong>${inStock ? "In Stock" : "Out of Stock"}</strong>
                                </div>
                            </div>
                        </section>

                    </div>
                `;

            } catch (error) {
                console.error("Product details error:", error);

                showError(
                    container,
                    "Unable to Load Product",
                    error.message || "Please try again later."
                );
            }
        }

        function showError(container, heading, message) {
            container.innerHTML = `
                <div class="message">
                    <div class="message-icon">📦</div>
                    <h2>${escapeHTML(heading)}</h2>
                    <p>${escapeHTML(message)}</p>
                    <a href="/products" class="button primary-button">
                        ← Back to Products
                    </a>
                </div>
            `;
        }

        loadProductDetails();
    </script>

</body>
</html>
